services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sentinel']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinel-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Always use postgres hostname inside Docker (ignores .env DATABASE_URL which uses localhost)
      DATABASE_URL: postgresql://${POSTGRES_USER:-sentinel}:${DB_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-sentinel}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      PROXY_API_KEY: ${PROXY_API_KEY}
      API_URL: ${API_URL:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      # LLM Configuration
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-self-hosted}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      MCP_PORT: ${MCP_PORT:-3001}
      A2A_PORT: ${A2A_PORT:-3002}
      ADMIN_MCP_PORT: ${ADMIN_MCP_PORT:-3003}
    ports:
      - '${PORT:-3000}:3000'
      - '${MCP_PORT:-3001}:${MCP_PORT:-3001}'
      - '${A2A_PORT:-3002}:${A2A_PORT:-3002}'
      - '${ADMIN_MCP_PORT:-3003}:${ADMIN_MCP_PORT:-3003}'
    networks:
      - sentinel-network

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      - api
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sentinel-network

volumes:
  postgres_data:

networks:
  sentinel-network:
    driver: bridge
